[package]
name = "regent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
thiserror = "2"
sysinfo = "0.40"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# DXCore is looked up at runtime through `libloading`, never linked statically:
# a machine without `dxcore.dll` must still launch Regent.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_DXCore",
] }
libloading = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
# `nvml-wrapper` dlopens `libnvidia-ml.so.1`; no driver means no NVIDIA entries.
nvml-wrapper = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"

[dev-dependencies]
tempfile = "3"
