[package]
name = "regent-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "regent_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["llama", "audio", "screen"]
llama = ["dep:llama-cpp-2", "llama-cpp-2/mtmd"]
audio = ["dep:cpal"]
screen = ["dep:xcap"]

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regent-core = { path = "../regent-core" }
thiserror = "2"
llama-cpp-2 = { version = "0.1.161", optional = true, default-features = false }
cpal = { version = "0.16", optional = true }
xcap = { version = "0.9.10", optional = true }
